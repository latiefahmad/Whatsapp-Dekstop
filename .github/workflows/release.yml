name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          go build -ldflags="-H windowsgui -s -w" -o WhatsApp.exe .

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Windows-x64
          path: WhatsApp.exe

  build-macos:
    name: Build macOS Universal (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python & Pillow
        run: |
          python3 -m pip install Pillow

      - name: Build macOS App Bundle
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
          ditto -c -k --sequesterRsrc --keepParent WhatsApp.app WhatsApp-macOS-Universal.zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-macOS-Universal
          path: |
            WhatsApp-macOS-Universal.dmg
            WhatsApp-macOS-Universal.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: WhatsApp-Windows-x64
          path: release-assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: WhatsApp-macOS-Universal
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/WhatsApp.exe
            release-assets/WhatsApp-macOS-Universal.dmg
            release-assets/WhatsApp-macOS-Universal.zip
          draft: false
          prerelease: false
          generate_release_notes: true
